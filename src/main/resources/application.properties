spring.messages.basename=messages
spring.messages.cache-seconds=-1
spring.messages.encoding=UTF-8

spring.thymeleaf.cache=false
spring.web.resources.cache.cachecontrol.no-cache=true

spring.datasource.url=${db_url:jdbc:derby:memory:demo;create=true}
spring.datasource.driver-class-name=${db_class_name:org.apache.derby.jdbc.EmbeddedDriver}
spring.datasource.username=${db_username:demo}
spring.datasource.password=${db_password:demo}
spring.datasource.platform=${db_platform:}
spring.datasource.continue-on-error=true

spring.mail.host=${mail_host:localhost}
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

spring.ldap.embedded.base-dn=dc=t246osslab,dc=org
spring.ldap.embedded.port=8389
spring.ldap.embedded.ldif=classpath:server.ldif

spring.http.multipart.max-file-size=-1
spring.http.multipart.max-request-size=-1

logging.file=logs/easybuggy.log
logging.level.org.springframework.web=INFO

#server.port=${port:80}
server.port=${port:443}
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=changeit
server.ssl.keyStoreType=PKCS12
server.ssl.keyAlias=tomcat

server.tomcat.basedir=
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.pattern=%t %a "%r" %s (%D ms)
server.tomcat.accesslog.buffered=false

server.tomcat.additional-tld-skip-patterns=derbyLocale_*.jar,xercesImpl.jar,xml-apis.jar,serializer.jar

management.security.enabled=false
metrics.allowed.hosts=127.0.0.1

##### The following properties are used by EasyBuggy
### Account Lockout feature
account.lock.time=3600000
account.lock.count=20

### Send Mail feature
mail.admin.address=root@localhost

### OpenID Connect feature
oidc.client.id=
oidc.client.secret=
oidc.configuration.endpoint=${oidc_config_endpoint:}
oidc.dynamic.client.registration.enabled=${oidc_dynamic_client_registration_enabled:false}
manage.account.page.url=${manage_account_page_url:}
attacker.app.url=${attacker_app_url:http://attacker.site}

# Local LLM settings
ollama.url=${ollama_url:http://ollama:11434}
ollama.model=${ollama_model:llama3.2:1b}

# Mini-CTF progress file (captured flags are persisted here so that progress
# survives restarts; under Docker this path must be on a mounted volume)
flag.progress.file=${flag_progress_file:data/flag-progress.txt}

# Denial of Wallet feature (simulated billing, US dollars)
dow.price.input.per.mtok=${dow_price_input_per_mtok:3}
dow.price.output.per.mtok=${dow_price_output_per_mtok:15}
dow.user.monthly.token.limit=${dow_user_monthly_token_limit:5000}
dow.total.monthly.token.limit=${dow_total_monthly_token_limit:20000}
dow.max.input.chars=${dow_max_input_chars:200}