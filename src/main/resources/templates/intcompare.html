<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-spring4-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" th:with="lang=${#locale.language}" th:lang="${lang}">
<div th:replace="head"></div>
<body style="margin-left: 20px; margin-right: 20px;">
	<div th:replace="header"></div>
	<form action="intcompare" method="post">
		<p th:text="#{description.compare.integers}" />
		<input type="text" name="number1" size="11" maxlength="11" th:value="${number1}" />
		<span> = </span>
		<input type="text" name="number2" size="11" maxlength="11" th:value="${number2}" /><br /><br />
		<input type="submit" th:value="#{label.determine}" /><br /><br />
		<div th:replace="messages"></div>
	</form>
</body>
</html>
