<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-spring4-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" th:with="lang=${#locale.language}"
      th:lang="${lang}">
<div th:replace="head"></div>
<body style="margin-left: 20px; margin-right: 20px;">
<script>
/*<![CDATA[*/
    function showUsage(usage) {
        document.getElementById("usageCost").textContent = usage.cost;
        document.getElementById("usageCalls").textContent = usage.calls;
        document.getElementById("usageInputTokens").textContent = usage.inputTokens;
        document.getElementById("usageOutputTokens").textContent = usage.outputTokens;
        const bar = document.getElementById("usageBar");
        bar.style.width = usage.percent + "%";
        bar.className = "progress-bar" + (usage.exhausted ? " progress-bar-danger" : "");
        if (usage.exhausted) {
            document.getElementById("askButton").disabled = true;
        }
    }

    async function ask() {
        const text = document.getElementById("inputText").value;
        const languages = Array.from(document.querySelectorAll("input[name='languages']:checked"))
            .map(function (e) { return e.value; });
        const requestBody = {
            "text": text,
            "languages": languages,
            "maxTokens": Number(document.getElementById("maxTokens").value)
        };
        const button = document.getElementById("askButton");
        button.disabled = true;
        document.getElementById("errorArea").textContent = "";
        document.getElementById("answerArea").textContent = "";
        try {
            const response = await fetch("/denialofwallet/ask", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(requestBody)
            });
            const data = await response.json();
            (data.answers || []).forEach(function (a) {
                const dt = document.createElement("dt");
                dt.textContent = a.language;
                const dd = document.createElement("dd");
                dd.textContent = a.answer;
                dd.style.marginBottom = "10px";
                document.getElementById("answerArea").append(dt, dd);
            });
            if (data.requestCost) {
                document.getElementById("requestCost").textContent = data.requestCost;
            }
            if (data.error) {
                document.getElementById("errorArea").textContent = data.error;
            }
            showUsage(data.usage);
        } finally {
            if (!document.getElementById("usageBar").className.includes("danger")) {
                button.disabled = false;
            }
        }
    }

    async function resetUsage() {
        const response = await fetch("/denialofwallet/reset", { method: "POST" });
        showUsage(await response.json());
        document.getElementById("askButton").disabled = false;
    }
/*]]>*/
</script>
<div th:replace="header"></div>
<form id="askForm">
    <p th:text="#{description.denialofwallet}"/>
    <textarea id="inputText" rows="5" cols="60" th:placeholder="#{msg.question.placeholder}"></textarea><br/>
    <label th:text="#{label.answer.languages}"></label>:
    <label style="font-weight: normal;"><input type="checkbox" name="languages" value="Japanese" checked="checked"/> <span th:text="#{label.target.language.ja}"></span></label>
    <label style="font-weight: normal;"><input type="checkbox" name="languages" value="English"/> <span th:text="#{label.target.language.en}"></span></label>
    <label style="font-weight: normal;"><input type="checkbox" name="languages" value="French"/> <span th:text="#{label.target.language.fr}"></span></label>
    <label style="font-weight: normal;"><input type="checkbox" name="languages" value="German"/> <span th:text="#{label.target.language.de}"></span></label>
    <label style="font-weight: normal;"><input type="checkbox" name="languages" value="Chinese"/> <span th:text="#{label.target.language.zh}"></span></label>
    <input type="hidden" id="maxTokens" value="256"/><br/>
    <button type="button" id="askButton" onclick="ask()" th:text="#{label.submit}"
            th:disabled="${!isLLMReady or usage['exhausted']}"></button><br/><br/>
    <label th:text="#{label.answer}"></label>:
    <dl id="answerArea"></dl>
    <div id="errorArea" class="text-danger"></div>
    <label th:text="#{label.this.request.cost}"></label>: <span id="requestCost">-</span><br/><br/>

    <h4 th:text="#{label.ai.usage}"></h4>
    <div class="progress" style="max-width: 500px;">
        <div id="usageBar" th:class="${usage['exhausted']} ? 'progress-bar progress-bar-danger' : 'progress-bar'"
             th:style="'width: ' + ${usage['percent']} + '%;'"></div>
    </div>
    <table class="table table-condensed" style="max-width: 500px;">
        <tr><th th:text="#{label.ai.cost}"></th><td><span id="usageCost" th:text="${usage['cost']}"></span> / <span th:text="${usage['budget']}"></span></td></tr>
        <tr><th th:text="#{label.ai.calls}"></th><td id="usageCalls" th:text="${usage['calls']}"></td></tr>
        <tr><th th:text="#{label.input.tokens}"></th><td><span id="usageInputTokens" th:text="${usage['inputTokens']}"></span> (<span th:text="${usage['inputPrice']}"></span> / 1M)</td></tr>
        <tr><th th:text="#{label.output.tokens}"></th><td><span id="usageOutputTokens" th:text="${usage['outputTokens']}"></span> (<span th:text="${usage['outputPrice']}"></span> / 1M)</td></tr>
    </table>
    <button type="button" onclick="resetUsage()" th:text="#{label.reset.usage}"></button><br/><br/>
    <div th:replace="messages"></div>
</form>
</body>
</html>
