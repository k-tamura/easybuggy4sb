<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-spring4-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" th:with="lang=${#locale.language}"
      th:lang="${lang}">
<div th:replace="head"></div>
<body style="margin-left: 20px; margin-right: 20px;">
<script>
/*<![CDATA[*/
    function showUsage(usage) {
        document.getElementById("usageTokens").textContent = usage.tokensUsed;
        document.getElementById("usageTotalTokens").textContent = usage.totalTokensUsed;
        document.getElementById("usageCost").textContent = usage.cost;
        document.getElementById("usageCalls").textContent = usage.calls;
        document.getElementById("usageInputTokens").textContent = usage.inputTokens;
        document.getElementById("usageOutputTokens").textContent = usage.outputTokens;
        const bar = document.getElementById("usageBar");
        bar.style.width = usage.percent + "%";
        bar.className = "progress-bar" + (usage.exhausted ? " progress-bar-danger" : "");
        const totalBar = document.getElementById("usageTotalBar");
        totalBar.style.width = usage.totalPercent + "%";
        totalBar.className = "progress-bar" + (usage.exhausted ? " progress-bar-danger" : "");
        document.getElementById("limitMsg").style.display = usage.exhausted ? "" : "none";
        if (usage.exhausted) {
            document.getElementById("askButton").disabled = true;
        }
    }

    async function ask() {
        const text = document.getElementById("inputText").value;
        const languages = Array.from(document.querySelectorAll("input[name='languages']:checked"))
            .map(function (e) { return e.value; });
        const requestBody = {
            "text": text,
            "languages": languages,
            "maxTokens": Number(document.getElementById("maxTokens").value)
        };
        const button = document.getElementById("askButton");
        button.disabled = true;
        document.getElementById("errorText").textContent = "";
        document.getElementById("errorArea").style.display = "none";
        document.getElementById("answerArea").textContent = "";
        try {
            const response = await fetch("/admins/denialofwallet/ask", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(requestBody)
            });
            const data = await response.json();
            (data.answers || []).forEach(function (a) {
                const dt = document.createElement("dt");
                dt.textContent = a.language;
                const dd = document.createElement("dd");
                const pre = document.createElement("pre");
                pre.textContent = a.answer;
                dd.appendChild(pre);
                dd.style.marginBottom = "10px";
                document.getElementById("answerArea").append(dt, dd);
            });
            if (data.requestCost) {
                document.getElementById("requestCost").textContent = data.requestCost;
            }
            if (data.error) {
                document.getElementById("errorText").textContent = data.error;
                document.getElementById("errorArea").style.display = "";
            }
            showUsage(data.usage);
        } finally {
            if (!document.getElementById("usageBar").className.includes("danger")) {
                button.disabled = false;
            }
        }
    }
/*]]>*/
</script>
<div th:replace="header"></div>
<form id="askForm">
    <p th:text="#{description.denialofwallet}"/>
    <textarea id="inputText" rows="5" cols="60" th:placeholder="#{msg.requirement.placeholder}"></textarea><br/>
    <small class="text-muted" th:text="#{msg.max.input.chars(${usage['maxInputChars']})}"></small><br/>
    <label th:text="#{label.prog.languages}"></label>:
    <label style="font-weight: normal;"><input type="checkbox" name="languages" value="Java" checked="checked"/> Java</label>
    <label style="font-weight: normal;"><input type="checkbox" name="languages" value="Python"/> Python</label>
    <label style="font-weight: normal;"><input type="checkbox" name="languages" value="JavaScript"/> JavaScript</label>
    <label style="font-weight: normal;"><input type="checkbox" name="languages" value="Go"/> Go</label>
    <label style="font-weight: normal;"><input type="checkbox" name="languages" value="Ruby"/> Ruby</label>
    <input type="hidden" id="maxTokens" value="256"/><br/>
    <button type="button" id="askButton" onclick="ask()" th:text="#{label.submit}"
            th:disabled="${!isLLMReady or usage['exhausted']}"></button>
    <span id="limitMsg" class="text-danger" style="margin-left: 10px; display: none;"
          th:style="${usage['exhausted']} ? 'margin-left: 10px;' : 'margin-left: 10px; display: none;'"
          th:text="#{msg.token.limit.reached}"></span><br/><br/>
    <label th:text="#{label.generated.code}"></label>:
    <dl id="answerArea"></dl>
    <div id="errorArea" class="alert alert-danger" role="alert" style="display: none;">
        <span class="glyphicon glyphicon-warning-sign"></span>
        <span id="errorText"></span>
    </div>
    <label th:text="#{label.this.request.cost}"></label>: <span id="requestCost">-</span><br/><br/>

    <h4 th:text="#{label.ai.usage}"></h4>
    <table class="table table-condensed" style="max-width: 700px;">
        <tr>
            <td colspan="2">
                <div style="overflow: hidden;">
                    <label th:text="#{label.ai.token.usage}"></label>
                    <span style="float: right;"><span id="usageTokens" th:text="${usage['tokensUsed']}"></span> / <span th:text="${usage['tokenLimit']}"></span></span>
                </div>
                <div class="progress" style="margin: 4px 0 0 0;">
                    <div id="usageBar" th:class="${usage['exhausted']} ? 'progress-bar progress-bar-danger' : 'progress-bar'"
                         th:style="'width: ' + ${usage['percent']} + '%;'"></div>
                </div>
            </td>
            <td colspan="2">
                <div style="overflow: hidden;">
                    <label th:text="#{label.ai.total.token.usage}"></label>
                    <span style="float: right;"><span id="usageTotalTokens" th:text="${usage['totalTokensUsed']}"></span> / <span th:text="${usage['totalTokenLimit']}"></span></span>
                </div>
                <div class="progress" style="margin: 4px 0 0 0;">
                    <div id="usageTotalBar" th:class="${usage['exhausted']} ? 'progress-bar progress-bar-danger' : 'progress-bar'"
                         th:style="'width: ' + ${usage['totalPercent']} + '%;'"></div>
                </div>
            </td>
        </tr>
        <tr>
            <th th:text="#{label.ai.cost}"></th><td id="usageCost" th:text="${usage['cost']}"></td>
            <th th:text="#{label.ai.calls}"></th><td id="usageCalls" th:text="${usage['calls']}"></td>
        </tr>
        <tr>
            <th th:text="#{label.input.tokens}"></th><td><span id="usageInputTokens" th:text="${usage['inputTokens']}"></span> (<span th:text="${usage['inputPrice']}"></span> / 1M)</td>
            <th th:text="#{label.output.tokens}"></th><td><span id="usageOutputTokens" th:text="${usage['outputTokens']}"></span> (<span th:text="${usage['outputPrice']}"></span> / 1M)</td>
        </tr>
    </table>
    <div th:replace="messages"></div>
</form>
</body>
</html>
